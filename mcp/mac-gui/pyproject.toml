[project]
name = "mac-gui"
version = "0.1.0"
description = "Local MCP that drives rekordbox, RMX-IGNITE Sample Manager and Audacity on macOS, and nothing else."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13,<2",
    "pyobjc-framework-ApplicationServices>=11",
    "pyobjc-framework-Quartz>=11",
]

[project.scripts]
mac-gui = "mac_gui.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_gui"]
